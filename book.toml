[book]
title = "可管理的衰老"
authors = ["张家林"]
description = "从连续穿戴监测到 iPSC 细胞与类器官计算平台：如何把个人衰老从命运改写成可测量、可解释、可有限度改写的轨迹。"
language = "zh-CN"
src = "src"

[build]
create-missing = false

[output.html]
smart-punctuation = false
mathjax-support = true
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/javik-heart/agemoco"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/javik-heart/agemoco/edit/main/{path}"
site-url = "/agemoco/"
additional-css = ["theme/custom.css"]
no-section-label = false

[output.html.print]
enable = true
page-break = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 30
teaser-word-count = 40
use-boolean-and = true
heading-split-level = 3
